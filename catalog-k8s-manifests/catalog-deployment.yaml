apiVersion: apps/v1
kind: Deployment
metadata:
  name: inv-catalog-deployment
  namespace: inventory-catalog
  labels:
    app: inv-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inv-catalog
  template:   
    metadata:
      labels:
        app: inv-catalog
    spec:
      containers:
        - name: inv-catalog-container
          image: codeworksak/inventory-catalog-cicd:03db80c83061bd18c991a51e1132061a339068ff
          ports:
            - containerPort: 8082
