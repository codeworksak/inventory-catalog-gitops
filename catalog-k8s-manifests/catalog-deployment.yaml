apiVersion: apps/v1
kind: Deployment
metadata:
  name: inv-catalog-deployment
  namespace: inventory-catalog
  labels:
    app: inv-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inv-catalog
  template:   
    metadata:
      labels:
        app: inv-catalog
    spec:
      containers:
        - name: inv-catalog-container
          image: codeworksak/inventory-catalog-cicd:4cfb9dcf640a93e7db46e0991765c50930d2214a
          ports:
            - containerPort: 8082
