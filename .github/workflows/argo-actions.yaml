name: Gitops pipeline with argo cd for inventory-catalog
on:
  workflow_dispatch:
 # push:
  #  branches:
     # - dev
env:
  GIT_PAT: ${{ secrets.GIT_PAT }}
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_USER: ${{ secrets.ARGOCD_USER }}
  ARGOCD_PASS: ${{ secrets.ARGOCD_PASS }}
  GIT_USER: ${{ secrets.GIT_USER }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from git hub
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 0
      - name: Setup java 25
        uses: actions/setup-java@v4
        with: 
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'
      - name: Build with maven
        run: ./mvnw -B clean package
      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/inventory-catalog-cicd:${{ github.sha }} .
      - name: Login to Docker Hub account
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      - name: Push docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USER }}/inventory-catalog-cicd:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from git hub
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 0   
      - name: Install kubectl 
        run: |
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x ./kubectl
            sudo mv ./kubectl /usr/local/bin/kubectl       
      - name: Install argocd CLI
        run: |
             curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
             chmod +x argocd
             sudo mv argocd /usr/local/bin/
      - name: Login to ArgoCD
        run: |
            echo ${{ secrets.ARGOCD_SERVER }}
            echo ${{ secrets.ARGOCD_USER }}
            argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USER }} \
            --password ${{ secrets.ARGOCD_PASS }} \
            --insecure
      - name: Update catalog-deployement.yaml with newly built image
        run: |
            git config user.name "${{ secrets.GIT_USER }}"
            git config user.email "${{ secrets.GIT_PASS }}"
            git fetch origin
            git checkout dev
            git pull origin dev

            cat catalog-k8s-manifests/catalog-deployment.yaml            
            sed -i "s|${{ secrets.DOCKERHUB_USER }}/inventory-catalog-cicd.*|${{ secrets.DOCKERHUB_USER }}/inventory-catalog-cicd:${{ github.sha }}|g" catalog-k8s-manifests/catalog-deployment.yaml
            cat catalog-k8s-manifests/catalog-deployment.yaml
            
      - name: Commit and push updated deployement.yaml
        run: |
             git config user.name "${{ secrets.GIT_USER }}"
             git config user.email "${{ secrets.GIT_PASS }}"
             echo https://$GIT_USER:$GIT_PAT@github.com/${{ github.repository }}.git
             git remote set-url origin https://$GIT_USER:$GIT_PAT@github.com/${{ github.repository }}.git

             git fetch origin
             git checkout dev
             git pull origin dev

             git add .
             git commit -m 'update image to inventory-catalog:${{ github.sha }}'
             git push origin dev

      - name: Refresh ArgoCd app and sync
        run: argocd app sync inventory-catalog
#      - name: Refresh ArgoCd app and sync
#       run: argocd app sync inventory-catalog
