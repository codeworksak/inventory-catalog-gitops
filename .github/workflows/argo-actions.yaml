name: Gitops pipeline with argo cd for inventory-catalog
on:
  push:
    branches:
      - dev
env:
  GIT_PAT: ${{ secrets.GIT_PAT }}
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from git hub
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 0
      - name: Setup java 25
        uses: actions/setup-java@v4
        with: 
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'
      - name: Build with maven
        run: ./mvnw -B clean package
      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USER }}/inventory-catalog:${{ github.sha }} .
      - name: Login to Docker Hub account
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      - name: Push docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USER }}/inventory-catalog:${{ github.sha }} 
